name: CA auto-date from signed Leap CAs

# Fills the Leap "Contingency Contract Signed Date" on jobs whose CA document was accepted
# (e-signed) in Leap. Leap has no webhook for document signing, so this polls.
# See scripts/ca-check.js and caCheck() in api/job-reps.js.

on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 min: look back 2 h
    - cron: '45 6 * * *'     # nightly ~2:45am ET: look back 48 h to catch anything missed
  workflow_dispatch:
    inputs:
      hours:
        description: 'Look back this many hours'
        required: false
        default: '2'
      write:
        description: 'Write dates (1) or dry run (0)'
        required: false
        default: '1'

concurrency:
  group: ca-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check for newly signed CAs
        env:
          HOURS: ${{ inputs.hours || (github.event.schedule == '45 6 * * *' && '48') || '2' }}
          WRITE: ${{ inputs.write || '1' }}
          SUMMARY_FILE: ${{ runner.temp }}/ca-check.txt
        run: node scripts/ca-check.js
      - name: Job summary
        if: always()
        env:
          SUMMARY_FILE: ${{ runner.temp }}/ca-check.txt
        run: |
          {
            echo "### CA auto-date"
            echo '```'
            cat "$SUMMARY_FILE" 2>/dev/null || echo "no summary (check failed early)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
