<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Douglas Roofing - Goals</title><style>
:root{--ink:#e6edf3;--dim:#8b949e;--line:#30363d;--blue:#58a6ff;--bg:#0d1117;--panel:#161b22;--panel2:#1c2129;--good:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:17px;margin:0;font-weight:600}
.meta{font-size:12px;color:var(--dim)}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin:0 8px}.nav a{color:var(--dim);text-decoration:none;font-size:13px;padding:5px 10px;border-radius:6px}.nav a:hover{color:#fff}.nav a.on{color:var(--ink)}
.hd{display:flex;gap:12px;align-items:center}
.wrap{max-width:1100px;margin:0 auto;padding:22px}
button{background:#1f6feb;color:#fff;border:1px solid #1f6feb;padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}button.ghost:hover{border-color:var(--dim)}
button.lnk{background:none;border:none;color:var(--blue);padding:2px 4px;font-size:12px}
button.danger{background:var(--panel);color:var(--bad);border:1px solid rgba(248,81,73,.45)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;color:var(--ink);font-family:inherit}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
select option{background:var(--panel);color:var(--ink)}
input[type=date]{color-scheme:dark}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:18px}
.bar .rl{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border-radius:0;background:var(--panel);color:var(--ink);border:none;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}.seg button.on{background:#1f6feb;color:#fff}
.sp{margin-left:auto}
h2{font-size:15px;margin:26px 0 12px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2 .muted{font-size:12px;font-weight:400}
.muted{color:var(--dim)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;border-top:3px solid var(--good)}
.card .label{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.card .value{font-size:24px;font-weight:700}
.card .sub{font-size:12px;color:var(--dim);margin-top:6px}
.prog{height:10px;background:#21262d;border-radius:6px;position:relative;margin-top:10px;overflow:visible}
.prog i{display:block;height:100%;border-radius:6px;background:var(--good)}
.prog i.behind{background:var(--warn)}.prog i.far{background:var(--bad)}
.prog b{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink);opacity:.6}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;font-size:14px;border-bottom:1px solid #21262d;vertical-align:top}
th{background:var(--panel2);color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tr:last-child td{border-bottom:none}
td.t{width:46%}td .n{font-size:12px;color:var(--dim);margin-top:3px;white-space:pre-wrap}
td.grp{background:var(--panel2)!important;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
.own{font-weight:600}.own.none{color:var(--dim);font-weight:400}
.late{color:var(--bad);font-weight:600}
.state{padding:26px;text-align:center;color:var(--dim);background:var(--panel);border:1px dashed var(--line);border-radius:12px}
.err{padding:12px 14px;border-radius:10px;background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.45);color:#ffa198;margin-bottom:14px;font-size:13px}
.lock{max-width:380px;margin:70px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
.lock h3{margin:0 0 6px}.lock input{width:100%;margin:14px 0 10px;font-size:15px;padding:10px}
.form{background:var(--panel);border:1px solid var(--blue);border-radius:12px;padding:16px;margin-bottom:18px;display:none}
.form.open{display:block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.grid .w2{grid-column:span 2}.grid .w4{grid-column:span 4}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.grid .w4{grid-column:span 2}td.t{width:auto}}
.summary{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:-4px 0 14px;color:var(--dim)}
.summary span b{font-size:15px;color:var(--ink)}.summary .bad b,.summary .bad{color:var(--bad)}
.qc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.qc.res{opacity:.6}
.qc .hd2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-bottom:6px}
.qc .txt{white-space:pre-wrap;word-wrap:break-word}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:1px 7px;border-radius:10px;border:1px solid var(--line)}
.tag.q{color:var(--warn);border-color:rgba(210,153,34,.5)}.tag.c{color:var(--blue);border-color:rgba(88,166,255,.45)}.tag.ok{color:var(--good);border-color:rgba(63,185,80,.45)}
.about{color:var(--blue);cursor:pointer}
.rep{border-left:2px solid var(--line);margin:10px 0 0 4px;padding:2px 0 2px 12px}
.rep .who{font-size:12px;color:var(--dim)}
.compose{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.compose textarea,.qc textarea{width:100%;resize:vertical}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--dim)}
.cnt{font-size:12px;color:var(--warn);margin-left:6px;cursor:pointer;background:none;border:none;padding:0}
</style></head><body>
<header><h1>Douglas Roofing - Goals</h1><nav class="nav"><a href="/revenue.html">Sales</a><a href="/ca-bonus.html">YTD</a><a href="/marketing.html">Marketing</a><a href="/punchout.html">Punch Out</a><a href="/goals.html" class="on">Goals</a></nav><div class="hd"><span class="meta" id="upd"></span><button id="lockBtn" class="ghost" style="display:none">Lock</button></div></header>
<div class="wrap" id="root"><div class="state">Loading...</div></div>
<script>
/* Goals page (2026-11-10). Owners' annual / quarterly / monthly goals: number goals tracked live from the
   dashboard (Contract Signed or Approved revenue, CAs, marketing CAs / appointments), and department task goals with an owner, status and due date.
   Separate Goals password (GOALS_PASSWORD) on top of the dashboard password; data is stored encrypted. */
var OWNERS=['Kyle','Mike','Adam'], STATUSES=['Not started','In progress','Done','Off track'];
var DEPTS=['Sales','Production','Marketing','Insurance / Claims','Repairs','Office / Admin','Finance','RVA']; // department goals must pick one (or Other)
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// Number goals track these dashboard figures live (company-wide, for the goal's period).
var METRICS={
  contract:{label:'Contract Signed revenue',unit:'$',src:'Leap, by contract signed date (Sales page headline)'},
  approved:{label:'Approved revenue',unit:'$',src:'Leap, by job awarded (approved) date'},
  cas:{label:'CAs signed',unit:'#',src:'Leap CA signed date, all jobs (Sales / YTD pages)'},
  mkt_cas:{label:'Marketing CAs signed',unit:'#',src:'Leap CA signed date on Marketing jobs (Marketing page)'},
  mkt_set:{label:'Marketing appointments set',unit:'#',src:'Leap appointments, Marketing division, up to today'},
  mkt_ran:{label:'Marketing appointments ran',unit:'#',src:'Leap appointments, Marketing division, excluding canceled / no answer'}
};
var MORDER=['contract','approved','cas','mkt_cas','mkt_set','mkt_ran'];
function isNum(g){return g.kind==='metric'||g.kind==='revenue';}
function metOf(g){return METRICS[g.metric]?g.metric:'contract';}
function fmtM(m,v){return METRICS[m].unit==='$'?money(v):Math.round(Number(v)||0).toLocaleString('en-US');}
var C=[], CF='open', DRAFT={text:'',type:'Question',to:'',about:''}, REPLY={};
var PW='', G=[], VIEW={period:'annual',year:0,quarter:0,month:0,owner:''}, EDIT=null, REV={};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '$'+Math.round(Number(n)||0).toLocaleString('en-US')}
function p2(n){return (n<10?'0':'')+n}
function isoD(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function store(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
(function(){var n=new Date();VIEW.year=n.getFullYear();VIEW.quarter=Math.floor(n.getMonth()/3)+1;VIEW.month=n.getMonth()+1;
  var v=load('goalsView');if(v){try{var o=JSON.parse(v);if(o.period)VIEW.period=o.period;if(o.owner!==undefined)VIEW.owner=o.owner;}catch(e){}}})();

function api(method,body){
  return fetch('/api/goals',{method:method,cache:'no-store',headers:Object.assign({'x-goals-password':PW},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.error||('HTTP '+r.status));e.status=r.status;throw e;}return j;});});
}
function lockScreen(msg){
  document.getElementById('lockBtn').style.display='none';document.getElementById('upd').textContent='';
  document.getElementById('root').innerHTML='<div class="lock"><h3>Owners\' goals</h3><div class="muted" style="font-size:13px">This page has its own password, separate from the dashboard.</div>'+
    (msg?'<div class="err" style="margin:12px 0 0">'+esc(msg)+'</div>':'')+
    '<input type="password" id="pw" placeholder="Goals password" autocomplete="current-password"><button id="go" style="width:100%">Unlock</button></div>';
  var go=function(){PW=document.getElementById('pw').value;if(!PW)return;start();};
  document.getElementById('go').onclick=go;document.getElementById('pw').onkeydown=function(e){if(e.key==='Enter')go();};
  document.getElementById('pw').focus();
}
function start(){
  document.getElementById('root').innerHTML='<div class="state">Loading goals...</div>';
  api('GET').then(function(j){store('goalsPw',PW);G=j.goals||[];C=j.comments||[];document.getElementById('lockBtn').style.display='';stamp(j.updated);render();})
  .catch(function(e){if(e.status===401){var typed=!!document.getElementById('pw')||!load('goalsPw');store('goalsPw',null);PW='';lockScreen(typed?'Wrong password.':'');}
    else{document.getElementById('root').innerHTML='<div class="err">'+esc(e.message)+'</div>';}});
}
function stamp(u){document.getElementById('upd').textContent=u?('Last change '+new Date(u).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})):'No goals saved yet';}
document.getElementById('lockBtn').onclick=function(){store('goalsPw',null);PW='';G=[];lockScreen('');};

// ---- periods ----
function range(g){ // [start,end] dates of a goal's period
  var y=g.year;
  if(g.period==='monthly')return [new Date(y,g.month-1,1),new Date(y,g.month,0)];
  if(g.period==='quarterly')return [new Date(y,(g.quarter-1)*3,1),new Date(y,g.quarter*3,0)];
  return [new Date(y,0,1),new Date(y,11,31)];
}
function label(g){return g.period==='monthly'?(MON[g.month-1]+' '+g.year):g.period==='quarterly'?('Q'+g.quarter+' '+g.year):(String(g.year));}
function inView(g){
  if(g.period!==VIEW.period||g.year!==VIEW.year)return false;
  if(g.period==='quarterly'&&g.quarter!==VIEW.quarter)return false;
  if(g.period==='monthly'&&g.month!==VIEW.month)return false;
  if(VIEW.owner&&g.owner!==VIEW.owner)return false;
  return true;
}
function viewGoal(){return {period:VIEW.period,year:VIEW.year,quarter:VIEW.quarter,month:VIEW.month};}

// ---- live actuals from the dashboard's own endpoints (all edge-cached) ----
var CACHE={};
function once(k,f){if(!CACHE[k])CACHE[k]=f().catch(function(e){return {error:String(e.message||e)}});return CACHE[k];}
function getJ(u){return fetch(u,{credentials:'omit'}).then(function(x){if(!x.ok)throw new Error('HTTP '+x.status);return x.json()});}
function clipRange(g){var r=range(g),t=new Date();return {s:r[0],e:r[1]<t?r[1]:t,future:r[0]>t};}
function revenueFor(s,e){return once('rev'+isoD(s)+isoD(e),function(){return getJ('/api/revenue?start='+isoD(s)+'&end='+isoD(e))});}
function casYear(y){return once('cas'+y,function(){return getJ('/api/leap-extra?jobs=1&year='+y)});}
function mktYear(y){ // default URL for the current year (same cache key as the Marketing page)
  return once('mkt'+y,function(){return getJ(y===new Date().getFullYear()?'/api/marketing?office=herndon':('/api/marketing?office=herndon&start='+y+'-01-01&end='+y+'-12-31'))});}
function actual(g){ // -> Promise<{value, extra, error, future}>
  var m=metOf(g),c=clipRange(g),f=isoD(c.s),t=isoD(c.e);
  if(c.future)return Promise.resolve({future:true,value:0});
  if(m==='contract'||m==='approved')return revenueFor(c.s,c.e).then(function(r){if(r.error)return r;var co=r.companyAll||r.company||{};
    var cn=Number(co.contract_amount)||0,ap=Number(co.approved_amount)||0;
    return m==='contract'?{value:cn,extra:'Approved '+money(ap)}:{value:ap,extra:'Contract Signed '+money(cn)};});
  if(m==='cas'||m==='mkt_cas'){
    var p=[casYear(g.year)];if(m==='mkt_cas')p.push(mktYear(g.year));
    return Promise.all(p).then(function(a){if(a[0].error)return a[0];if(a[1]&&a[1].error)return a[1];
      var mj={};if(a[1])(a[1].records||[]).forEach(function(r){if(r.job)mj[r.job]=1;});
      var n=(a[0].jobs||[]).filter(function(j){return j.date>=f&&j.date<=t&&(m==='cas'||j.division==='Marketing'||mj[j.job]);}).length;
      return {value:n,extra:'as of '+(a[0].updated||'?')};});
  }
  return mktYear(g.year).then(function(d){if(d.error)return d;var nr={};(d.notRan||[]).forEach(function(x){nr[x]=1;});
    var rs=(d.records||[]).filter(function(r){return r.d>=f&&r.d<=t;});
    var ran=rs.filter(function(r){return !nr[r.res];}).length;
    return m==='mkt_set'?{value:rs.length,extra:ran+' ran'}:{value:ran,extra:rs.length+' set'};});
}
function pace(g){var r=range(g),t=new Date();if(t<r[0])return 0;if(t>r[1])return 1;return (t-r[0])/(r[1]-r[0]+864e5);}

function render(){
  store('goalsView',JSON.stringify({period:VIEW.period,owner:VIEW.owner}));
  var years=[];for(var y=new Date().getFullYear()-1;y<=new Date().getFullYear()+2;y++)years.push(y);
  G.forEach(function(g){if(years.indexOf(g.year)<0)years.push(g.year)});years.sort();
  var H=[];
  H.push('<div class="bar"><div class="seg">'+['annual','quarterly','monthly'].map(function(p){return '<button data-p="'+p+'" class="'+(VIEW.period===p?'on':'')+'">'+p.charAt(0).toUpperCase()+p.slice(1)+'</button>'}).join('')+'</div>');
  H.push('<select id="vy">'+years.map(function(y){return '<option'+(y===VIEW.year?' selected':'')+'>'+y+'</option>'}).join('')+'</select>');
  if(VIEW.period==='quarterly')H.push('<select id="vq">'+[1,2,3,4].map(function(q){return '<option value="'+q+'"'+(q===VIEW.quarter?' selected':'')+'>Q'+q+'</option>'}).join('')+'</select>');
  if(VIEW.period==='monthly')H.push('<select id="vm">'+MON.map(function(m,i){return '<option value="'+(i+1)+'"'+(i+1===VIEW.month?' selected':'')+'>'+m+'</option>'}).join('')+'</select>');
  H.push('<span class="rl" style="margin-left:10px">Owner</span><select id="vo"><option value="">All 3</option>'+OWNERS.map(function(o){return '<option'+(o===VIEW.owner?' selected':'')+'>'+o+'</option>'}).join('')+'<option value="__none"'+(VIEW.owner==='__none'?' selected':'')+'>Unassigned</option></select>');
  H.push('<button class="sp" id="addRev">+ Number goal</button><button id="addTask">+ Goal</button></div>');
  H.push('<div class="form" id="form"></div>');

  var list=G.filter(function(g){return VIEW.owner==='__none'?(inViewNoOwner(g)&&!g.owner):inView(g);});
  var rev=list.filter(isNum).sort(function(a,b){return MORDER.indexOf(metOf(a))-MORDER.indexOf(metOf(b))}), tasks=list.filter(function(g){return !isNum(g)});
  var per=label(viewGoal());

  H.push('<h2>Number goals <span class="muted">'+esc(per)+' · tracked live from the dashboard · the tick marks where you should be today</span></h2>');
  if(!rev.length)H.push('<div class="state">No number goals for '+esc(per)+'. <button class="lnk" id="addRev2">Add one</button> (revenue, CAs or marketing appointments)</div>');
  else{H.push('<div class="cards">');rev.forEach(function(g){var m=metOf(g);H.push('<div class="card" id="rc_'+g.id+'"><div class="label"><span>'+esc(METRICS[m].label)+(g.title&&g.title!=='Company'&&g.title!=='Revenue goal'?' · '+esc(g.title):'')+'</span><span>'+ownerHtml(g)+'</span></div><div class="value">... <span class="muted" style="font-size:14px;font-weight:400">of '+fmtM(m,g.target)+'</span></div><div class="prog"><i style="width:0"></i></div><div class="sub">Loading revenue...</div><div style="margin-top:8px"><button class="lnk" data-edit="'+g.id+'">Edit</button><button class="lnk" data-ask="'+g.id+'">Comment</button>'+cntHtml(g)+'</div></div>');});H.push('</div>');}

  var done=tasks.filter(function(g){return g.status==='Done'}).length, off=tasks.filter(function(g){return g.status==='Off track'}).length;
  H.push('<h2>Department goals <span class="muted">'+esc(per)+'</span></h2>');
  if(tasks.length)H.push('<div class="summary"><span><b>'+tasks.length+'</b> goals</span><span><b>'+done+'</b> done</span><span><b>'+tasks.filter(function(g){return g.status==='In progress'}).length+'</b> in progress</span><span class="'+(off?'bad':'')+'"><b>'+off+'</b> off track</span><span class="muted">'+Math.round(done*100/tasks.length)+'% complete</span></div>');
  if(!tasks.length)H.push('<div class="state">No department goals for '+esc(per)+(VIEW.owner?' for this owner':'')+'. <button class="lnk" id="addTask2">Add one</button></div>');
  else{
    var byD={};tasks.forEach(function(g){var d=g.department||'No department set';(byD[d]=byD[d]||[]).push(g)});
    var order=Object.keys(byD).sort(function(a,b){var ia=DEPTS.indexOf(a),ib=DEPTS.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)});
    var stOrder={'Off track':0,'In progress':1,'Not started':2,'Done':3};
    H.push('<table><tr><th>Goal</th><th>Owner</th><th>Status</th><th>Due</th><th></th></tr>');
    order.forEach(function(d){
      H.push('<tr><td colspan="5" class="grp">'+esc(d)+' <span class="muted" style="font-weight:400">('+byD[d].filter(function(g){return g.status==='Done'}).length+'/'+byD[d].length+' done)</span></td></tr>');
      byD[d].sort(function(a,b){return (stOrder[a.status]-stOrder[b.status])||String(a.due||'9').localeCompare(String(b.due||'9'))}).forEach(function(g){
        var late=g.due&&g.status!=='Done'&&g.due<isoD(new Date());
        H.push('<tr><td class="t">'+esc(g.title)+(g.notes?'<div class="n">'+esc(g.notes)+'</div>':'')+'</td><td>'+ownerHtml(g)+'</td>'+
          '<td><select data-st="'+g.id+'">'+STATUSES.map(function(s){return '<option'+(s===g.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select></td>'+
          '<td class="'+(late?'late':'')+'">'+(g.due?new Date(g.due+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'<span class="muted">-</span>')+(late?' (late)':'')+'</td>'+
          '<td style="white-space:nowrap"><button class="lnk" data-edit="'+g.id+'">Edit</button><button class="lnk" data-ask="'+g.id+'">Comment</button>'+cntHtml(g)+'</td></tr>');
      });
    });
    H.push('</table>');
  }
  H.push(commentsHtml());
  var other=G.filter(function(g){return g.period!==VIEW.period||g.year!==VIEW.year}).length;
  H.push('<div class="muted" style="font-size:12px;margin-top:16px">Saved encrypted; only someone with the Goals password can read it. '+G.length+' goals and '+C.length+' questions / comments in total'+(other?(', '+other+' in other periods'):'')+'.</div>');
  document.getElementById('root').innerHTML=H.join('');
  wire();wireComments();
  rev.forEach(fillRev);
}
function inViewNoOwner(g){var o=VIEW.owner;VIEW.owner='';var r=inView(g);VIEW.owner=o;return r;}
function ownerHtml(g){return g.owner?'<span class="own">'+esc(g.owner)+'</span>':'<span class="own none">Unassigned</span>';}
function fillRev(g){
  var m=metOf(g);
  actual(g).then(function(r){
    var el=document.getElementById('rc_'+g.id);if(!el)return;
    var of=' <span class="muted" style="font-size:14px;font-weight:400">of '+fmtM(m,g.target);
    if(r.future){el.querySelector('.value').innerHTML=fmtM(m,0)+of+'</span>';el.querySelector('.sub').textContent='This period has not started yet.';return;}
    if(r.error){el.querySelector('.sub').textContent='Could not load: '+r.error;return;}
    var v=r.value,pct=g.target?v/g.target:0,pc=pace(g),cls=(pct>=pc-0.02)?'':(pct>=pc-0.15?'behind':'far');
    el.style.borderTopColor=cls==='far'?'var(--bad)':cls==='behind'?'var(--warn)':'var(--good)';
    el.querySelector('.value').innerHTML=fmtM(m,v)+of+' ('+Math.round(pct*100)+'%)</span>';
    el.querySelector('.prog').innerHTML='<i class="'+cls+'" style="width:'+Math.min(100,pct*100).toFixed(1)+'%"></i>'+(pc>0&&pc<1?'<b style="left:'+(pc*100).toFixed(1)+'%"></b>':'');
    var need=Math.max(0,g.target-v), left=Math.max(0,Math.ceil((range(g)[1]-new Date())/864e5));
    var st=pc>=1?(v>=g.target?'Goal hit':'Missed by '+fmtM(m,need)):('On pace for '+fmtM(m,pc>0?v/pc:0)+' · '+fmtM(m,need)+' to go, '+left+' days left');
    el.querySelector('.sub').innerHTML=(r.extra?esc(r.extra)+' · ':'')+st+'<br><span style="opacity:.75">'+esc(METRICS[m].src)+'</span>';
  });
}
function wire(){
  [].forEach.call(document.querySelectorAll('.seg button'),function(b){b.onclick=function(){VIEW.period=b.getAttribute('data-p');render();};});
  var on=function(id,f){var e=document.getElementById(id);if(e)e.onchange=f;};
  on('vy',function(){VIEW.year=+this.value;render();});on('vq',function(){VIEW.quarter=+this.value;render();});
  on('vm',function(){VIEW.month=+this.value;render();});on('vo',function(){VIEW.owner=this.value;render();});
  ['addRev','addRev2'].forEach(function(id){var e=document.getElementById(id);if(e)e.onclick=function(){openForm(Object.assign(viewGoal(),{kind:'metric',metric:'contract',title:'',department:'Company',owner:VIEW.owner&&VIEW.owner!=='__none'?VIEW.owner:''}));};});
  ['addTask','addTask2'].forEach(function(id){var e=document.getElementById(id);if(e)e.onclick=function(){openForm(Object.assign(viewGoal(),{kind:'task',owner:VIEW.owner&&VIEW.owner!=='__none'?VIEW.owner:''}));};});
  [].forEach.call(document.querySelectorAll('[data-edit]'),function(b){b.onclick=function(){openForm(G.filter(function(g){return g.id===b.getAttribute('data-edit')})[0]);};});
  [].forEach.call(document.querySelectorAll('[data-st]'),function(s){s.onchange=function(){var g=G.filter(function(x){return x.id===s.getAttribute('data-st')})[0];save(Object.assign({},g,{status:s.value}),s);};});
}
function openForm(g){
  EDIT=g||{};var f=document.getElementById('form'),rv=isNum(EDIT);
  var opt=function(arr,cur,blank){return (blank?'<option value="">'+blank+'</option>':'')+arr.map(function(x){return '<option'+(x===cur?' selected':'')+'>'+x+'</option>'}).join('')};
  f.innerHTML='<div style="font-weight:600;margin-bottom:12px">'+(EDIT.id?'Edit goal':'New '+(rv?'number goal':'goal'))+'</div><div class="grid">'+
    '<label class="w2">Type<select id="f_kind"><option value="task"'+(rv?'':' selected')+'>Department goal (a task)</option><option value="metric"'+(rv?' selected':'')+'>Number goal (tracked from the dashboard)</option></select></label>'+
    '<label class="w2" id="l_met">Tracks<select id="f_metric">'+MORDER.map(function(k){return '<option value="'+k+'"'+(k===metOf(EDIT)?' selected':'')+'>'+METRICS[k].label+'</option>'}).join('')+'</select></label>'+
    '<label class="w4"><span id="l_title">'+(rv?'Label (optional)':'Goal')+'</span><input id="f_title" value="'+esc(EDIT.title==='Company'||EDIT.title==='Revenue goal'?'':(EDIT.title||''))+'" placeholder="'+(rv?'e.g. Stretch target':'e.g. Define repair department pricing')+'"></label>'+
    '<label>Period<select id="f_period">'+['annual','quarterly','monthly'].map(function(p){return '<option value="'+p+'"'+(p===EDIT.period?' selected':'')+'>'+p.charAt(0).toUpperCase()+p.slice(1)+'</option>'}).join('')+'</select></label>'+
    '<label>Year<input id="f_year" type="number" value="'+(EDIT.year||VIEW.year)+'"></label>'+
    '<label id="l_q">Quarter<select id="f_quarter">'+[1,2,3,4].map(function(q){return '<option value="'+q+'"'+(q===(EDIT.quarter||VIEW.quarter)?' selected':'')+'>Q'+q+'</option>'}).join('')+'</select></label>'+
    '<label id="l_m">Month<select id="f_month">'+MON.map(function(m,i){return '<option value="'+(i+1)+'"'+(i+1===(EDIT.month||VIEW.month)?' selected':'')+'>'+m+'</option>'}).join('')+'</select></label>'+
    '<label id="l_dep">Department *<select id="f_dept"><option value="">Choose a department</option>'+DEPTS.map(function(d){return '<option'+(d===EDIT.department?' selected':'')+'>'+esc(d)+'</option>'}).join('')+'<option value="__other"'+(EDIT.department&&DEPTS.indexOf(EDIT.department)<0&&EDIT.department!=='Company'?' selected':'')+'>Other…</option></select></label>'+
    '<label id="l_depo">Other department<input id="f_depo" value="'+esc(EDIT.department&&DEPTS.indexOf(EDIT.department)<0&&EDIT.department!=='Company'?EDIT.department:'')+'" placeholder="Department name"></label>'+
    '<label>Owner<select id="f_owner">'+opt(OWNERS,EDIT.owner,'Unassigned')+'</select></label>'+
    '<label id="l_t"><span id="l_tl">Target</span><input id="f_target" type="number" min="0" step="any" value="'+(EDIT.target||'')+'"></label>'+
    '<label id="l_s">Status<select id="f_status">'+opt(STATUSES,EDIT.status||'Not started')+'</select></label>'+
    '<label id="l_d">Due date<input id="f_due" type="date" value="'+esc(EDIT.due||'')+'"></label>'+
    '<label class="w4">Notes / sub-steps<textarea id="f_notes" rows="2">'+esc(EDIT.notes||'')+'</textarea></label></div>'+
    '<div id="f_err" class="err" style="display:none;margin-top:10px"></div>'+
    '<div style="display:flex;gap:8px;margin-top:12px"><button id="f_save">Save</button><button class="ghost" id="f_cancel">Cancel</button>'+(EDIT.id?'<button class="danger" id="f_del" style="margin-left:auto">Delete</button>':'')+'</div>';
  f.classList.add('open');
  var sync=function(){var p=document.getElementById('f_period').value,k=document.getElementById('f_kind').value;
    document.getElementById('l_q').style.display=p==='quarterly'?'':'none';document.getElementById('l_m').style.display=p==='monthly'?'':'none';
    var num=k==='metric',mk=document.getElementById('f_metric').value;
    document.getElementById('l_t').style.display=num?'':'none';document.getElementById('l_met').style.display=num?'':'none';
    document.getElementById('l_tl').textContent=METRICS[mk].unit==='$'?'Target ($)':'Target (count)';
    document.getElementById('l_title').textContent=num?'Label (optional)':'Goal';
    ['l_s','l_d','l_dep'].forEach(function(id){document.getElementById(id).style.display=num?'none':''});
    document.getElementById('l_depo').style.display=(!num&&document.getElementById('f_dept').value==='__other')?'':'none';};
  document.getElementById('f_period').onchange=sync;document.getElementById('f_kind').onchange=sync;document.getElementById('f_metric').onchange=sync;document.getElementById('f_dept').onchange=sync;sync();
  document.getElementById('f_cancel').onclick=function(){f.classList.remove('open');f.innerHTML='';};
  document.getElementById('f_save').onclick=function(){
    var v=function(id){return document.getElementById(id).value};
    var num=v('f_kind')==='metric', dep=num?'Company':(v('f_dept')==='__other'?v('f_depo').trim():v('f_dept'));
    if(!num&&!dep){var x=document.getElementById('f_err');x.style.display='';x.textContent='Pick the department this goal belongs to.';return;}
    if(!num&&!v('f_title').trim()){var y=document.getElementById('f_err');y.style.display='';y.textContent='Give the goal a name.';return;}
    save({id:EDIT.id,kind:v('f_kind'),metric:v('f_metric'),title:v('f_title'),period:v('f_period'),year:+v('f_year'),quarter:+v('f_quarter'),month:+v('f_month'),department:dep,owner:v('f_owner'),target:+v('f_target')||0,status:v('f_status'),due:v('f_due'),notes:v('f_notes')},document.getElementById('f_save'),true);
  };
  if(EDIT.id)document.getElementById('f_del').onclick=function(){
    var b=this;if(b.textContent!=='Click again to delete'){b.textContent='Click again to delete';return;}
    b.disabled=true;api('POST',{action:'delete',id:EDIT.id}).then(function(j){G=j.goals;C=j.comments||C;stamp(j.updated);render();}).catch(function(e){showErr(e)});
  };
  document.getElementById('f_title').focus();f.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function showErr(e){var x=document.getElementById('f_err');if(x){x.style.display='';x.textContent=e.message;}else alert(e.message);if(e.status===401){store('goalsPw',null);}}
function save(goal,btn,fromForm){
  if(btn)btn.disabled=true;
  api('POST',{action:'upsert',goal:goal}).then(function(j){G=j.goals;C=j.comments||C;stamp(j.updated);
    if(fromForm){VIEW.period=goal.period;VIEW.year=goal.year;if(goal.period==='quarterly')VIEW.quarter=goal.quarter;if(goal.period==='monthly')VIEW.month=goal.month;}
    render();})
  .catch(function(e){if(btn)btn.disabled=false;showErr(e);});
}
// ---- Questions & comments (2026-11-17) ----
// One running thread list for the three owners: ask a question or leave a comment, optionally about a goal and/or
// for one owner; reply, resolve, reopen. Who is posting is picked once per browser (no per-person logins).
function me(){var m=load('goalsMe');return OWNERS.indexOf(m)>=0?m:'';}
function goalById(id){return G.filter(function(g){return g.id===id})[0];}
function goalName(g){return isNum(g)?(METRICS[metOf(g)].label+(g.title&&g.title!=='Company'&&g.title!=='Revenue goal'?' - '+g.title:'')):g.title;}
function openFor(g){return C.filter(function(c){return c.goalId===g.id&&!c.resolved}).length;}
function cntHtml(g){var n=openFor(g);return n?'<button class="cnt" data-jump="'+g.id+'" title="Open questions / comments on this goal">&#128172; '+n+'</button>':'';}
function when(t){return t?new Date(t).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';}
function mineToAnswer(c){var m=VIEW.owner&&VIEW.owner!=='__none'?VIEW.owner:me();return c.type==='Question'&&!c.resolved&&m&&(c.to===m||(!c.to&&c.by!==m));}
function commentsHtml(){
  var who=me(), H=[];
  var vis=C.filter(function(c){return CF==='all'||(CF==='open'?!c.resolved:c.resolved);});
  if(VIEW.owner&&VIEW.owner!=='__none')vis=vis.filter(function(c){return c.by===VIEW.owner||c.to===VIEW.owner||!c.to;});
  vis.sort(function(a,b){return (a.resolved-b.resolved)||((b.type==='Question'&&!b.resolved)-(a.type==='Question'&&!a.resolved))||String(b.updated||b.created).localeCompare(String(a.updated||a.created));});
  var openQ=C.filter(function(c){return c.type==='Question'&&!c.resolved}).length;
  H.push('<h2 id="qa">Questions &amp; comments <span class="muted">'+openQ+' open question'+(openQ===1?'':'s')+' · for the Tuesday owners meeting or anything in between</span></h2>');
  var aboutOpts=G.slice().sort(function(a,b){return (inView(b)-inView(a))||String(goalName(a)).localeCompare(goalName(b));});
  H.push('<div class="compose"><textarea id="c_text" rows="2" placeholder="Ask a question or leave a comment for the other owners...">'+esc(DRAFT.text)+'</textarea>'+
    '<div class="crow"><select id="c_type">'+['Question','Comment'].map(function(t){return '<option'+(t===DRAFT.type?' selected':'')+'>'+t+'</option>'}).join('')+'</select>'+
    'from <select id="c_by"><option value="">Who are you?</option>'+OWNERS.map(function(o){return '<option'+(o===who?' selected':'')+'>'+o+'</option>'}).join('')+'</select>'+
    'for <select id="c_to"><option value="">All owners</option>'+OWNERS.map(function(o){return '<option'+(o===DRAFT.to?' selected':'')+'>'+o+'</option>'}).join('')+'</select>'+
    'about <select id="c_about" style="max-width:300px"><option value="">General (no goal)</option>'+aboutOpts.map(function(g){return '<option value="'+g.id+'"'+(g.id===DRAFT.about?' selected':'')+'>'+esc(label(g)+' · '+goalName(g))+'</option>'}).join('')+'</select>'+
    '<button id="c_post" class="sp">Post</button></div><div id="c_err" class="err" style="display:none;margin:10px 0 0"></div></div>');
  H.push('<div class="bar" style="margin-bottom:12px"><div class="seg" id="cf">'+[['open','Open'],['resolved','Resolved'],['all','All']].map(function(x){return '<button data-cf="'+x[0]+'" class="'+(CF===x[0]?'on':'')+'">'+x[1]+' ('+C.filter(function(c){return x[0]==='all'||(x[0]==='open'?!c.resolved:c.resolved)}).length+')</button>'}).join('')+'</div>'+
    (VIEW.owner&&VIEW.owner!=='__none'?'<span class="muted" style="font-size:12px">Showing posts from, for, or to everyone incl. '+esc(VIEW.owner)+'</span>':'')+'</div>');
  if(!vis.length)H.push('<div class="state">'+(CF==='open'?'Nothing open. Questions and comments you post show up here until someone marks them resolved.':'Nothing here yet.')+'</div>');
  vis.forEach(function(c){
    var g=c.goalId?goalById(c.goalId):null, q=c.type==='Question';
    H.push('<div class="qc'+(c.resolved?' res':'')+'" id="qc_'+c.id+'"><div class="hd2">'+
      '<span class="tag '+(c.resolved?'ok':q?'q':'c')+'">'+(c.resolved?'Resolved':esc(c.type))+'</span>'+
      '<b style="color:var(--ink)">'+esc(c.by)+'</b>'+(c.to?' &rarr; <b style="color:var(--ink)">'+esc(c.to)+'</b>':' &rarr; all owners')+
      (c.goalId?(g?' · on <span class="about" data-goto="'+g.id+'">'+esc(label(g)+' · '+goalName(g))+'</span>':' · on a deleted goal'):'')+
      ' · '+when(c.created)+(mineToAnswer(c)?' · <span style="color:var(--warn);font-weight:600">waiting on you</span>':'')+'</div>'+
      '<div class="txt">'+esc(c.text)+'</div>');
    (c.replies||[]).forEach(function(r){H.push('<div class="rep"><div class="who"><b style="color:var(--ink)">'+esc(r.by)+'</b> · '+when(r.at)+'</div><div class="txt">'+esc(r.text)+'</div></div>');});
    if(c.resolved)H.push('<div class="muted" style="font-size:12px;margin-top:8px">Resolved'+(c.resolvedBy?' by '+esc(c.resolvedBy):'')+' '+when(c.resolvedAt)+'</div>');
    if(REPLY[c.id]!==undefined)H.push('<div style="margin-top:10px"><textarea rows="2" data-rt="'+c.id+'" placeholder="Reply as '+esc(who||'...')+'">'+esc(REPLY[c.id])+'</textarea>'+
      '<div class="crow"><button data-rs="'+c.id+'">Post reply</button><button class="ghost" data-rx="'+c.id+'">Cancel</button>'+(q&&!c.resolved?'<label style="display:flex;gap:5px;align-items:center"><input type="checkbox" data-rr="'+c.id+'"> Answered - mark resolved</label>':'')+'</div></div>');
    H.push('<div class="crow" style="margin-top:6px">'+(REPLY[c.id]===undefined?'<button class="lnk" data-reply="'+c.id+'">Reply</button>':'')+
      '<button class="lnk" data-res="'+c.id+'" data-v="'+(c.resolved?'0':'1')+'">'+(c.resolved?'Reopen':'Mark resolved')+'</button>'+
      '<button class="lnk" style="color:var(--bad);margin-left:auto" data-cdel="'+c.id+'">Delete</button></div><div class="err" style="display:none;margin-top:8px" id="ce_'+c.id+'"></div></div>');
  });
  return H.join('');
}
function cpost(body,btn,errEl,after){
  if(btn)btn.disabled=true;
  return api('POST',body).then(function(j){G=j.goals||G;C=j.comments||[];stamp(j.updated);if(after)after();render();})
    .catch(function(e){if(btn)btn.disabled=false;if(errEl){errEl.style.display='';errEl.textContent=e.message;}else alert(e.message);if(e.status===401)store('goalsPw',null);});
}
function needMe(errEl){var m=me();if(!m){errEl.style.display='';errEl.textContent='Pick who you are in the "from" box first (remembered on this computer).';}return m;}
function wireComments(){
  var q=function(sel,f){[].forEach.call(document.querySelectorAll(sel),f);};
  var t=document.getElementById('c_text');if(!t)return;
  t.oninput=function(){DRAFT.text=t.value;};
  document.getElementById('c_type').onchange=function(){DRAFT.type=this.value;};
  document.getElementById('c_to').onchange=function(){DRAFT.to=this.value;};
  document.getElementById('c_about').onchange=function(){DRAFT.about=this.value;};
  document.getElementById('c_by').onchange=function(){store('goalsMe',this.value||null);};
  document.getElementById('c_post').onclick=function(){
    var err=document.getElementById('c_err'),m=needMe(err);if(!m)return;
    if(!DRAFT.text.trim()){err.style.display='';err.textContent='Write something first.';return;}
    cpost({action:'comment',comment:{type:DRAFT.type,by:m,to:DRAFT.to,goalId:DRAFT.about,text:DRAFT.text}},this,err,function(){DRAFT.text='';DRAFT.about='';CF='open';});
  };
  q('#cf button',function(b){b.onclick=function(){CF=b.getAttribute('data-cf');render();};});
  q('[data-reply]',function(b){b.onclick=function(){REPLY[b.getAttribute('data-reply')]='';render();var x=document.querySelector('[data-rt="'+b.getAttribute('data-reply')+'"]');if(x)x.focus();};});
  q('[data-rt]',function(x){x.oninput=function(){REPLY[x.getAttribute('data-rt')]=x.value;};});
  q('[data-rx]',function(b){b.onclick=function(){delete REPLY[b.getAttribute('data-rx')];render();};});
  q('[data-rs]',function(b){b.onclick=function(){
    var id=b.getAttribute('data-rs'),err=document.getElementById('ce_'+id),m=needMe(err);if(!m)return;
    var txt=(REPLY[id]||'').trim();if(!txt){err.style.display='';err.textContent='Write a reply first.';return;}
    var rr=document.querySelector('[data-rr="'+id+'"]'),andResolve=rr&&rr.checked;
    b.disabled=true;
    api('POST',{action:'reply',id:id,reply:{by:m,text:txt}}).then(function(j){C=j.comments||[];delete REPLY[id];
      return andResolve?cpost({action:'resolve',id:id,resolved:true,by:m},null,err):(stamp(j.updated),render());})
    .catch(function(e){b.disabled=false;err.style.display='';err.textContent=e.message;});
  };});
  q('[data-res]',function(b){b.onclick=function(){var id=b.getAttribute('data-res');cpost({action:'resolve',id:id,resolved:b.getAttribute('data-v')==='1',by:me()},b,document.getElementById('ce_'+id));};});
  q('[data-cdel]',function(b){b.onclick=function(){if(b.textContent!=='Click again to delete'){b.textContent='Click again to delete';return;}
    var id=b.getAttribute('data-cdel');cpost({action:'delete_comment',id:id},b,document.getElementById('ce_'+id));};});
  q('[data-ask]',function(b){b.onclick=function(){DRAFT.about=b.getAttribute('data-ask');render();var x=document.getElementById('c_text');x.scrollIntoView({behavior:'smooth',block:'center'});x.focus();};});
  q('[data-jump]',function(b){b.onclick=function(){CF='open';render();var id=b.getAttribute('data-jump'),first=C.filter(function(c){return c.goalId===id&&!c.resolved})[0];
    var el=first&&document.getElementById('qc_'+first.id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.borderColor='var(--blue)';}};});
  q('[data-goto]',function(b){b.onclick=function(){var g=goalById(b.getAttribute('data-goto'));if(!g)return;
    VIEW.period=g.period;VIEW.year=g.year;if(g.quarter)VIEW.quarter=g.quarter;if(g.month)VIEW.month=g.month;render();window.scrollTo({top:0,behavior:'smooth'});};});
}
PW=load('goalsPw');if(PW)start();else lockScreen('');
