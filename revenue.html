<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Douglas Roofing - Dashboard</title><style>
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f6f9;color:#0f2438}
header{background:#0f2438;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:17px;margin:0;font-weight:600}
.meta{font-size:12px;color:#aebfd2}
.wrap{max-width:1040px;margin:0 auto;padding:22px}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;margin-bottom:22px}
@media(max-width:780px){.cards{grid-template-columns:1fr 1fr}}
@media(max-width:460px){.cards{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #e5e9f0;border-radius:12px;padding:16px 18px}
.card .label{font-size:12px;color:#6b7888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.card .value{font-size:26px;font-weight:700}
.card .sub{font-size:11px;color:#6b7888;margin-top:6px}
.d{border-top:3px solid #7c3aed}.k{border-top:3px solid #b8860b}.a{border-top:3px solid #1f6feb}.c{border-top:3px solid #1a7f37}
h2{font-size:15px;margin:24px 0 12px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5e9f0;border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:11px 14px;font-size:14px;border-bottom:1px solid #eef1f6}
th{background:#fafbfc;color:#6b7888;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.rank{color:#9aa6b4;width:30px}
button{background:#1f6feb;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer}
.state{padding:30px;text-align:center;color:#6b7888}
tfoot td{font-weight:700;background:#fafbfc;border-top:2px solid #e5e9f0}
.hd{display:flex;gap:12px;align-items:center}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin:0 8px}.nav a{color:#aebfd2;text-decoration:none;font-size:13px;padding:5px 10px;border-radius:6px}.nav a.on{background:#1f6feb;color:#fff}.nav a:hover{color:#fff}

.rangebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #e5e9f0;border-radius:12px;padding:10px 14px;margin-bottom:18px}
.rangebar input[type=date]{border:1px solid #dfe4ec;border-radius:8px;padding:6px 8px;font-size:13px;color:#0f2438;font-family:inherit}
.rangebar .rl{font-size:12px;color:#6b7888;text-transform:uppercase;letter-spacing:.5px}
.rangebar button.ghost{background:#fff;color:#1f6feb;border:1px solid #cfe0fb}
.rangebar .note{font-size:12px;color:#6b7888;margin-left:auto}
</style></head><body>
<header><h1>Douglas Roofing - DC Dashboard (Month to Date)</h1><nav class="nav"><a href="/revenue.html" class="on">Herndon</a><a href="/richmond.html">Richmond</a><a href="/ca-bonus.html">CA Bonus</a><a href="/marketing.html">Marketing</a></nav><div class="hd"><span class="meta" id="upd"></span><button id="rf">Refresh</button></div></header>
<div class="wrap">
<div class="rangebar"><span class="rl">Range</span><input type="date" id="dFrom"><span class="rl">to</span><input type="date" id="dTo"><button id="apply">Apply</button><button id="d7" class="ghost">Last 7 days</button><button id="reset" class="ghost">Month to date</button><span class="note" id="rangeNote">Month to date</span></div>
<div class="cards">
<div class="card d"><div class="label">Doors Knocked</div><div class="value" id="cDr">-</div><div class="sub">Pins this month</div></div>
<div class="card k"><div class="label">CAs</div><div class="value" id="cCa">-</div><div class="sub" id="caUpd">SR / Leap CAs this month</div></div>
<div class="card a"><div class="label">Approved Revenue</div><div class="value" id="cAp">-</div><div class="sub">Job awarded date</div></div>
<div class="card c"><div class="label">Contract Signed Revenue</div><div class="value" id="cCn">-</div><div class="sub">Contract signed date</div></div>
</div>
<div id="tw"><div class="state">Loading...</div></div></div>
</div>
<script>
var fmt=function(n){return '$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
var CUR=null;
function pad2(n){return (n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function fullMonthIdx(rg){var s=new Date(rg.start+'T12:00:00'),e=new Date(rg.end+'T12:00:00');if(s.getFullYear()!==(new Date()).getFullYear())return -1;if(s.getMonth()!==e.getMonth())return -1;if(s.getDate()!==1)return -1;var last=new Date(s.getFullYear(),s.getMonth()+1,0).getDate();if(e.getDate()!==last)return -1;return s.getMonth()}
function srcs(rg){
if(!rg){return Promise.all([
fetch('/api/ca-history?office=herndon&live=1',{cache:'no-store'}).then(function(r){return r.json()}).catch(function(){return {reps:[],months:[]}}),
fetch('/api/doors?office=herndon&live=1',{cache:'no-store'}).then(function(r){return r.json()}).catch(function(){return {reps:[],total:0,roster:[],allowedReps:[]}})
])}
return fetch('/api/range?office=herndon&start='+rg.start+'&end='+rg.end,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
if(j.error)throw new Error(j.error);
var ca={updated:j.updated,reps:(j.reps||[]).map(function(x){return {rep:x.rep,counts:[x.cas||0]}})};
var dr={updated:j.updated,total:(j.totals&&j.totals.doors)||0,reps:(j.reps||[]).map(function(x){return {rep:x.rep,doors:x.doors||0}}),roster:(j.roster||[]),allowedReps:(j.allowedReps||[])};
return [ca,dr];
})}
// Resolve p, but give up after ms and resolve `fallback` instead. Needed because
// /api/range does a full SalesRabbit event scan and times out on long ranges --
// without this the whole page sat on "Loading..." forever while the revenue tiles
// silently kept showing the PREVIOUS range's numbers.
function withTimeout(p,ms,fallback){return new Promise(function(resolve){var done=false;var t=setTimeout(function(){if(done)return;done=true;resolve(fallback)},ms);p.then(function(v){if(done)return;done=true;clearTimeout(t);resolve(v)},function(){if(done)return;done=true;clearTimeout(t);resolve(fallback)})})}
var ALIAS={'mike mccarthy':'michael mccarthy','izzy price':'isabelle price','robert mumford-wilson':'robert wilson'};
function dkey(n){var x=norm(n);return ALIAS[x]||x}
function load(rg){
CUR=rg||null;
var b=document.getElementById('rf');b.disabled=true;
document.getElementById('tw').innerHTML='<div class="state">Loading...</div>';
var _mIdx=CUR?fullMonthIdx(CUR):(new Date()).getMonth();
var _leapNA=!!(CUR&&_mIdx<0);
document.getElementById('rangeNote').textContent=CUR?(CUR.start+' → '+CUR.end+(_leapNA?'  ·  Leap CAs are monthly — showing SR CAs':'')):'Month to date';
var S={rev:null,le:{leapCA:{}},ca:{reps:[]},dr:{reps:[],roster:[],allowedReps:[],teamByRep:{},total:0},srState:'loading',mIdx:_mIdx,leapNA:_leapNA};
// Phase 1 -- Leap revenue. Fast and range-accurate, so paint it immediately
// instead of blocking behind the SalesRabbit scan.
var pRev=Promise.all([
fetch('/api/leap-extra?office=herndon',{cache:'no-store'}).then(function(r){return r.json()}).catch(function(){return {leapCA:{}}}),
fetch('/api/revenue'+(CUR?('?start='+CUR.start+'&end='+CUR.end):''),{cache:'no-store'}).then(function(r){return r.json()})
]).then(function(a){S.le=a[0]||{leapCA:{}};S.rev=a[1];if(S.rev&&S.rev.error)throw new Error(S.rev.error);render(S);});
// Phase 2 -- SalesRabbit doors/CAs. Fills in the door columns when it lands.
var pSR=withTimeout(srcs(CUR),30000,null).then(function(v){
if(!v){S.srState='timeout'}else{S.ca=v[0]||{reps:[]};S.dr=v[1]||S.dr;S.srState='ok'}
if(S.rev)render(S);
},function(){S.srState='timeout';if(S.rev)render(S);});
pRev.catch(function(e){document.getElementById('tw').innerHTML='<div class="state" style="color:#b42318">Could not load: '+esc(String(e.message||e))+'</div>'});
Promise.all([pRev.catch(function(){}),pSR.catch(function(){})]).then(function(){b.disabled=false;});
}
function render(S){
var rev=S.rev,ca=S.ca||{reps:[]},dr=S.dr||{},le=S.le||{};
var _leapNA=S.leapNA,_curM=S.mIdx;
document.getElementById('upd').textContent='Updated '+new Date(rev.updated||Date.now()).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
if(ca.updated)document.getElementById('caUpd').textContent='SR / Leap CAs · as of '+new Date(ca.updated).toLocaleDateString('en-US',{month:'short',day:'numeric'});
var map={};
// dkey (not norm) so the alias table applies to Leap names too -- otherwise
// "Mike McCarthy" from Leap and "Michael McCarthy" from SalesRabbit became two
// separate rows and the revenue never merged onto the rep with the doors.
(rev.reps||[]).forEach(function(r){map[dkey(r.rep)]={rep:r.rep,approved:r.approved_amount||0,contract:r.contract_amount||0,cas:0,doors:0}});
(ca.reps||[]).forEach(function(c){var cc=(c.counts&&c.counts.length)?c.counts[c.counts.length-1]:0;var k=dkey(c.rep);if(map[k]){map[k].cas=cc}else{map[k]={rep:c.rep,approved:0,contract:0,cas:cc,doors:0}}});
(dr.reps||[]).forEach(function(d){var k=dkey(d.rep);if(map[k]){map[k].doors=d.doors}else{map[k]={rep:d.rep,approved:0,contract:0,cas:0,doors:d.doors}}});
(dr.roster||[]).forEach(function(nm){var k=dkey(nm);if(!map[k]){map[k]={rep:nm,approved:0,contract:0,cas:0,doors:0}}});
var _lc=(le&&le.leapCA)||{};var _leapCur={};if(!_leapNA){Object.keys(_lc).forEach(function(rp){_leapCur[dkey(rp)]=(_lc[rp]||[])[_curM]||0;});}Object.keys(map).forEach(function(k){map[k].leapCa=_leapNA?null:(_leapCur[k]||0);});
var rowsArr=Object.keys(map).map(function(k){return map[k]});
// Nothing is dropped here any more. The old code hard-filtered Haley Barry,
// "solomon", Adam Mulvaney and "unassigned" by name, then dropped everyone
// missing from the SalesRabbit roster -- and because the headline was the sum of
// the surviving rows, that revenue vanished from the dashboard entirely. Those
// reps now land in the Unassigned / Inactive group and stay in the total.
var teamByRep=(dr&&dr.teamByRep)||{};
var haveTeams=Object.keys(teamByRep).length>0;
var allowSet=new Set(dr.allowedReps||[]);
rowsArr.forEach(function(r){var k=dkey(r.rep);
if(!haveTeams){r.team='all';return}
r.team=(teamByRep[k]!==undefined)?teamByRep[k]:(allowSet.has(k)?'other':'unassigned');});
var TEAMS=haveTeams?[['selfgen','Self-Gen'],['jack',"Jack's Team"],['mccarthy',"McCarthy's Team"],['inbound','Inbound'],['retail','Retail'],['other','Other'],['unassigned','Unassigned / Inactive — not on the SalesRabbit roster']]:[['all','All Reps']];
function tot(a){var t={d:0,c:0,ap:0,cn:0,lp:0};a.forEach(function(r){t.d+=(r.doors||0);t.c+=(r.cas||0);t.ap+=(r.approved||0);t.cn+=(r.contract||0);t.lp+=(r.leapCa||0)});return t}
function ratio(d,l,c){if(_leapNA)return c>0?Math.round(d/c):'—';return l>0?Math.round(d/l):'—';}
function rowH(r,i){return '<tr><td class="rank">'+(i+1)+'</td><td>'+esc(r.rep)+'</td><td class="num">'+(S.srState==='ok'?(r.doors||0):'—')+'</td><td class="num">'+(S.srState==='ok'?(r.cas||0):'—')+' / '+(_leapNA?'—':(r.leapCa||0))+'</td><td class="num">'+(S.srState==='ok'?ratio(r.doors||0,r.leapCa||0,r.cas||0):'—')+'</td><td class="num">'+fmt(r.approved)+'</td><td class="num" style="font-weight:600">'+fmt(r.contract)+'</td></tr>';}
function foot(t){return '<tr><td></td><td>Total</td><td class="num">'+(S.srState==='ok'?t.d:'—')+'</td><td class="num">'+(S.srState==='ok'?t.c:'—')+' / '+(_leapNA?'—':t.lp)+'</td><td class="num">'+(S.srState==='ok'?ratio(t.d,t.lp,t.c):'—')+'</td><td class="num">'+fmt(t.ap)+'</td><td class="num">'+fmt(t.cn)+'</td></tr>';}
var THEAD='<table><thead><tr><th class="rank">#</th><th>Rep</th><th class="num">Doors</th><th class="num">CAs (SR/Leap)</th><th class="num">Doors/CA</th><th class="num">Approved</th><th class="num">Contract Signed</th></tr></thead><tbody>';
var off=tot(rowsArr);
// Headline = Leap's own company total INCLUDING deactivated users, not the sum of
// the rendered rows. companyAll comes straight off the same report endpoint Leap's
// Sales Performance Report uses, so it reconciles with a report run there.
var cAll=rev.companyAll||rev.company||null;
var headAp=cAll?(+cAll.approved_amount||0):off.ap;
var headCn=cAll?(+cAll.contract_amount||0):off.cn;
document.getElementById('cDr').textContent=(S.srState==='ok')?off.d:(S.srState==='timeout'?'—':'...');
document.getElementById('cCa').textContent=(S.srState==='ok')?(off.c+' / '+(_leapNA?'—':off.lp)):(S.srState==='timeout'?'—':'...');
document.getElementById('cAp').textContent=fmt(headAp);
document.getElementById('cCn').textContent=fmt(headCn);
var html='';
if(S.srState==='loading'){html+='<div class="state" style="color:#6b7888">Revenue is live. Loading doors and CAs from SalesRabbit...</div>'}
else if(S.srState==='timeout'){html+='<div class="state" style="color:#b45309">Doors and CAs unavailable for this range — the SalesRabbit scan timed out. Revenue figures below are correct for the selected range.</div>'}
// Attribution check: every dollar in the headline should appear in a row below.
// If it does not, say so out loud rather than quietly under-reporting.
var gapAp=Math.round((headAp-off.ap)*100)/100, gapCn=Math.round((headCn-off.cn)*100)/100;
if(Math.abs(gapAp)>1||Math.abs(gapCn)>1){html+='<div class="state" style="color:#b45309">Unattributed to any rep: '+fmt(gapAp)+' approved / '+fmt(gapCn)+' contract signed. Headline totals come from Leap; the difference is revenue Leap reports at company level but not against a rep row.</div>'}
if(rev.inactive&&((+rev.inactive.approved_amount)||(+rev.inactive.contract_amount))){html+='<div class="state" style="color:#6b7888">Includes deactivated Leap users: '+fmt(rev.inactive.approved_amount)+' approved / '+fmt(rev.inactive.contract_amount)+' contract signed.</div>'}
TEAMS.forEach(function(p){var g=rowsArr.filter(function(r){return r.team===p[0];});if(!g.length)return;g.sort(function(x,y){return (y.contract-x.contract)||(y.approved-x.approved)||(y.doors-x.doors)});var t=tot(g);var note=(p[0]==='unassigned')?' · inactive reps, house accounts and names Leap reports that SalesRabbit does not':'';html+='<h2 style="margin-top:26px">'+p[1]+' <span style="color:#6b7888;font-weight:400">('+g.length+' reps · by Contract Signed'+note+')</span></h2>'+THEAD+g.map(rowH).join('')+'</tbody><tfoot>'+foot(t)+'</tfoot></table>';});
document.getElementById('tw').innerHTML=html||'<div class="state">No activity in this period</div>';
}
document.getElementById('rf').addEventListener('click',function(){load(CUR);});
document.getElementById('apply').addEventListener('click',function(){var s=document.getElementById('dFrom').value,e=document.getElementById('dTo').value;if(!s||!e){alert('Pick both a start and end date.');return}if(e<s){alert('End date is before start date.');return}load({start:s,end:e});});
document.getElementById('d7').addEventListener('click',function(){var n=new Date();var s=new Date(n.getTime()-6*864e5);document.getElementById('dFrom').value=iso(s);document.getElementById('dTo').value=iso(n);load({start:iso(s),end:iso(n)});});
document.getElementById('reset').addEventListener('click',function(){var n=new Date();document.getElementById('dFrom').value=iso(new Date(n.getFullYear(),n.getMonth(),1));document.getElementById('dTo').value=iso(n);load(null);});
(function(){var n=new Date();document.getElementById('dFrom').value=iso(new Date(n.getFullYear(),n.getMonth(),1));document.getElementById('dTo').value=iso(n);})();
load();
</script>

<style id="dark-theme">
html,body{background:#0d1117 !important;color:#e6edf3 !important}
header,.hd{background:#161b22 !important;border-bottom:1px solid #30363d !important}
.card,table,.rangebar,.rangebar button.ghost,tfoot td{background:#161b22 !important;border-color:#30363d !important;color:#e6edf3 !important}
th{background:#0d1117 !important;color:#8b949e !important;border-color:#30363d !important}
td,tr,thead,tbody{border-color:#30363d !important}
.rangebar button.ghost{color:#e6edf3 !important}
.note,.sub,.meta,.label,.dim,.muted{color:#8b949e !important}
input,select{background:#0d1117 !important;color:#e6edf3 !important;border-color:#30363d !important}
.nav a{color:#8b949e !important}
.nav a.on{background:transparent !important;color:#e6edf3 !important}
</style>
</body></html>
