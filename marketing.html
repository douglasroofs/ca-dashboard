<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Douglas Roofing - Marketing</title>
<style>
  :root{--ink:#0f2438;--dim:#6b7888;--line:#e5e9f0;--blue:#1f6feb;--bg:#f6f8fb;
        --good:#0f8a4a;--warn:#b06f00;--bad:#c2352b;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:650}
  .nav a{color:var(--dim);text-decoration:none;margin-right:13px;font-size:13px}
  .nav a:hover,.nav a.on{color:var(--ink);font-weight:600}
  .wrap{padding:18px 22px;max-width:1380px}
  .rangebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:16px}
  .rangebar input[type=date]{border:1px solid #dfe4ec;border-radius:8px;padding:6px 8px;font-size:13px;color:var(--ink);font-family:inherit}
  .rangebar .rl{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .rangebar button{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
  .rangebar button.ghost{background:#fff;color:var(--blue);border:1px solid #cfe0fb}
  .rangebar .note{font-size:12px;color:var(--dim);margin-left:auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .card .label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  .card .value{font-size:25px;font-weight:680;margin-top:3px}
  .card .sub{font-size:12px;color:var(--dim)}
  .card.hi{border-color:var(--blue)}
  .card.credit{border-color:var(--warn)}
  .card.credit .value{color:var(--warn)}
  .card.alert .value{color:var(--bad)}
  section{margin-bottom:22px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 8px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;background:#fbfcfe}
  tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right}
  .ca{color:var(--good);font-weight:640}
  .rt{color:var(--blue);font-weight:640}
  .bad{color:var(--bad);font-weight:640}
  .muted{color:var(--dim);font-size:12px}
  .err{color:var(--bad);background:#fff;border:1px solid var(--bad);border-radius:12px;padding:12px}
  input[type=search]{border:1px solid #dfe4ec;border-radius:8px;padding:7px 10px;font-size:13px;width:250px;margin-bottom:8px;font-family:inherit}
  /* --- appointment calendar --- */
  .lg{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin:0 0 10px;align-items:center}
  .lg i{font-style:normal;font-weight:700;font-size:9px;letter-spacing:.05em;padding:1px 5px;border-radius:4px;background:rgba(127,127,127,.14)}
  .cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  .mo{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(127,127,127,.04)}
  .mo .mh{padding:8px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);border-bottom:1px solid var(--line);display:flex}
  .mo .mh b{margin-left:auto;color:var(--ink);font-weight:650;letter-spacing:0;text-transform:none}
  .dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .dow div{padding:5px 4px;text-align:center;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
  .dy{min-height:78px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:3px 4px}
  .grid .dy:nth-child(7n+1){border-left:none}
  .dy.out{opacity:.3}
  .dy .dn{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dy.has .dn{color:var(--ink);font-weight:680}
  /* accents use inset box-shadow, not border, so the dark-theme border override can't flatten them */
  .ap{font-size:11px;line-height:1.3;margin-top:3px;padding:2px 5px 3px 7px;border-radius:5px;background:rgba(127,127,127,.11);box-shadow:inset 3px 0 0 var(--dim)}
  .ap .tg{font-size:9px;font-weight:700;letter-spacing:.05em;color:var(--dim)}
  .ap b{display:block;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ap em{font-style:normal;color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ap.ca{box-shadow:inset 3px 0 0 var(--good)} .ap.ca .tg{color:var(--good)}
  .ap.rt{box-shadow:inset 3px 0 0 var(--blue)} .ap.rt .tg{color:var(--blue)}
  .ap.un{box-shadow:inset 3px 0 0 var(--bad)}  .ap.un .tg{color:var(--bad)}
  .ap.nr{box-shadow:inset 3px 0 0 var(--warn)} .ap.nr .tg{color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>Douglas Roofing - Marketing</h1>
  <nav class="nav"><a href="/revenue.html">Herndon</a><a href="/richmond.html">Richmond</a><a href="/ca-bonus.html">CA Bonus</a><a href="/marketing.html" class="on">Marketing</a></nav>
  <span class="muted" id="stamp" style="margin-left:auto"></span>
</header>
<div class="wrap">
  <div class="rangebar">
    <span class="rl">Range</span>
    <input type="date" id="dFrom"><span class="rl">to</span><input type="date" id="dTo">
    <button id="apply">Apply</button>
    <button class="ghost" id="mtd">MTD</button>
    <button class="ghost" id="lastm">Last month</button>
    <button class="ghost" id="ytd">YTD</button>
    <span class="note" id="note"></span>
  </div>
  <div id="root"><p class="muted">Loading...</p></div>
</div>
<script>
var D=null;
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var money=function(n){return '$'+(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});};
var pct=function(a,b){return b?Math.round(a*100/b)+'%':'-';};
var iso=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

fetch('/api/marketing?office=herndon&t='+Date.now(),{cache:'no-store'})
 .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
 .then(function(d){D=d;init();})
 .catch(function(e){document.getElementById('root').innerHTML='<div class="err">Could not load: '+esc(e.message)+'</div>';});

function init(){
  document.getElementById('stamp').textContent='Updated '+new Date(D.updated).toLocaleString()+' - '+D.division;
  setMTD();
  document.getElementById('apply').onclick=draw;
  document.getElementById('mtd').onclick=function(){setMTD();draw();};
  document.getElementById('ytd').onclick=function(){var n=new Date();document.getElementById('dFrom').value=n.getFullYear()+'-01-01';document.getElementById('dTo').value=iso(n);draw();};
  document.getElementById('lastm').onclick=function(){var n=new Date();var s=new Date(n.getFullYear(),n.getMonth()-1,1);var e=new Date(n.getFullYear(),n.getMonth(),0);document.getElementById('dFrom').value=iso(s);document.getElementById('dTo').value=iso(e);draw();};
  draw();
}
function setMTD(){var n=new Date();document.getElementById('dFrom').value=iso(new Date(n.getFullYear(),n.getMonth(),1));document.getElementById('dTo').value=iso(n);}

// Cost for a range. Whole months count in full, partial months prorate by day
// count. Runs over each source separately so the breakdown and the total stay
// consistent - the total is the sum of what is displayed, never a second
// calculation that could drift from it.
// ---- Cost helpers -------------------------------------------------------
var dayKey=function(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);};
var monthKey=function(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);};

// `partial` names a month whose recorded figure is already spend-TO-DATE rather
// than a whole month's total - LSA and Facebook are read off a billing console
// mid-month. Prorating those a SECOND time charges them twice for the same days.
// A retainer is different - it genuinely accrues by the day - so it passes no
// `partial` and still prorates.
//
// The flag EXPIRES. While its month is still running the denominator is the days
// elapsed so far, which is right. Once that month CLOSES the figure is simply
// incomplete, and spreading it over a full month under-reports for ever - a
// 20-day number wearing a 31-day label. That happened to August 2026: $12,514
// covering the 1st to the 20th kept being read as the whole month. No arithmetic
// recovers the missing days, so the figure is used as recorded and the staleness
// is raised as a WARNING rather than quietly absorbed.
function spendOf(by,from,to,partial){
  var total=0; by=by||{};
  var now=new Date();
  Object.keys(by).forEach(function(m){
    var y=+m.slice(0,4),mo=+m.slice(5,7)-1;
    var mStart=new Date(y,mo,1), mEnd=new Date(y,mo+1,0);
    var s=new Date(Math.max(mStart,from)), e=new Date(Math.min(mEnd,to));
    if(e<s)return;
    // floor, not round: the range end carries 23:59:59, so round() charged an
    // extra day whenever the range stopped mid-month - a one-day range billed two.
    var daysIn=Math.floor((e-s)/86400000)+1, daysM=mEnd.getDate();
    if(m===partial && dayKey(to)>=dayKey(now)){
      // Denominator is days ELAPSED, not the whole month. For a month that has
      // already closed those are the same, so the recorded figure is taken as-is.
      var elapsed=new Date(Math.min(mEnd,now)).getDate();
      total += by[m]*Math.min(1,daysIn/elapsed);
      return;
    }
    total += by[m]*(daysIn/daysM);
  });
  return total;
}

// A partial month that has already closed was never finalised - someone has to
// paste the real total in. Say so instead of letting it under-report in silence.
function stalePartial(partial){ return !!partial && partial < monthKey(new Date()); }

// The other way a source goes quiet: the current month is absent from the data
// entirely, so it reads as zero spend rather than as missing data.
function missingThisMonth(by,to){
  var now=new Date();
  if(dayKey(to) < dayKey(now)) return false;
  return !by || by[monthKey(now)]===undefined;
}

function warnHtml(C){
  if(!C.warn||!C.warn.length) return '';
  return '<div style="border-left:4px solid #d97706;background:rgba(217,119,6,0.10);padding:10px 12px;border-radius:6px;margin:0 0 12px">'
    + '<div style="font-weight:600;font-size:13px;margin-bottom:4px">Cost data needs attention</div>'
    + '<div style="font-size:12px;line-height:1.6;opacity:.9">'
    + C.warn.map(function(w){return '&bull; '+w;}).join('<br>') + '</div></div>';
}

function costsFor(from,to){
  var C=D.costs||{};
  // Only the actuals declare a partial month; the retainer deliberately does not.
  var lsaPart=(C.lsa&&C.lsa.partialMonth)||(D.spend&&D.spend.partialMonth)||null;
  var fbPart=(C.facebook&&C.facebook.partialMonth)||null;
  var lsaBy=(C.lsa&&C.lsa.byMonth)||(D.spend&&D.spend.byMonth);
  var fbBy=C.facebook&&C.facebook.byMonth;
  var lsa=spendOf(lsaBy,from,to,lsaPart);
  var fb=spendOf(fbBy,from,to,fbPart);
  var ag=spendOf(C.agency&&C.agency.byMonth,from,to);
  var warn=[];
  if(stalePartial(lsaPart)) warn.push('Google LSA '+lsaPart+' was recorded part-way through the month and never finalised - that month is understated.');
  if(stalePartial(fbPart)) warn.push('Facebook '+fbPart+' was recorded part-way through the month and never finalised - that month is understated.');
  if(missingThisMonth(lsaBy,to)) warn.push('No Google LSA spend recorded for '+monthKey(new Date())+' yet.');
  if(missingThisMonth(fbBy,to)) warn.push('No Facebook spend recorded for '+monthKey(new Date())+' yet.');
  return {lsa:lsa, facebook:fb, agency:ag, total:lsa+fb+ag, warn:warn,
          fbLive:!!(C.facebook&&C.facebook.live), fbNote:(C.facebook&&C.facebook.note)||''};
}
// kept so anything else calling spendFor still works
function spendFor(from,to){ return costsFor(from,to).total; }
function draw(){
  var f=document.getElementById('dFrom').value, t=document.getElementById('dTo').value;
  if(!f||!t)return;
  var from=new Date(f+'T00:00:00'), to=new Date(t+'T23:59:59');
  var recs=D.records.filter(function(r){return r.d>=f && r.d<=t;});
  var notRan={}; D.notRan.forEach(function(x){notRan[x]=1;});
  var isCA={}; D.caResults.forEach(function(x){isCA[x]=1;});
  var isRT={}; D.retailResults.forEach(function(x){isRT[x]=1;});

  var T={set:0,ran:0,ca:0,rt:0,un:0}, reps={}, results={}, src={};
  recs.forEach(function(r){
    if(!reps[r.rep])reps[r.rep]={rep:r.rep,set:0,ran:0,ca:0,rt:0,un:0,byRes:{}};
    var R=reps[r.rep];
    T.set++;R.set++;
    if(!notRan[r.res]){T.ran++;R.ran++;}
    if(isCA[r.res]){T.ca++;R.ca++;}
    if(isRT[r.res]){T.rt++;R.rt++;}
    if(!r.res){T.un++;R.un++;}
    var rk=r.res||'(unresulted)';
    results[rk]=(results[rk]||0)+1;
    R.byRes[rk]=(R.byRes[rk]||0)+1;
    src[r.src]=(src[r.src]||0)+1;
  });
  var C=costsFor(from,to), spend=C.total, signed=T.ca+T.rt;
  document.getElementById('note').textContent=recs.length+' appointments in range';

  var H=[];
  H.push('<div class="cards">');
  H.push(card(T.set,'Appointments Set'));
  H.push(card(T.ran,'Ran','', pct(T.ran,T.set)+' of set'));
  H.push(card(T.ca,'CA Signed','ca', pct(T.ca,T.ran)+' of ran'));
  H.push(card(T.rt,'Retail / Repair','rt', pct(T.rt,T.ran)+' of ran'));
  H.push('<div class="card alert"><div class="label">Unresulted</div><div class="value">'+T.un+'</div><div class="sub">'+pct(T.un,T.set)+' of set</div></div>');
  H.push('</div>');

  H.push(calSection(recs,f,t,isCA,isRT,notRan));

  H.push('<section><h2>Marketing cost <span class="muted" style="font-size:12px;font-weight:400">'+(C.fbLive?'Facebook live from Meta':'Facebook not connected yet')+'</span></h2>' + warnHtml(C) + '<div class="cards">');
  H.push('<div class="card hi"><div class="label">Total marketing cost</div><div class="value">'+money(C.total)+'</div><div class="sub">LSA + Facebook + retainer, in range</div></div>');
  H.push('<div class="card"><div class="label">Cost per appt ran</div><div class="value">'+(T.ran?money(C.total/T.ran):'-')+'</div><div class="sub">'+T.ran+' ran</div></div>');
  H.push('<div class="card"><div class="label">Cost per signed</div><div class="value">'+(signed?money(C.total/signed):'-')+'</div><div class="sub">'+signed+' CA + retail</div></div>');
  H.push('<div class="card credit"><div class="label">Pending credit</div><div class="value">'+money((D.spend&&D.spend.pendingCredit)||0)+'</div><div class="sub">expected back for disputed leads</div></div>');
  H.push('</div>');
  H.push('<table style="margin-top:14px"><tr><th>Source</th><th class="num">Cost in range</th><th class="num">Share</th><th>Where it comes from</th></tr>');
  [['Google LSA',C.lsa,'manual - LSA billing console, 2 accounts'],
   ['Facebook ads',C.facebook,C.fbLive?'live - Meta Marketing API':('not connected - '+(C.fbNote||'add META_ACCESS_TOKEN in Vercel'))],
   ['Marketing company',C.agency,'retainer schedule, prorated by day']]
  .forEach(function(r){
    H.push('<tr><td>'+esc(r[0])+'</td><td class="num">'+money(r[1])+'</td><td class="num">'+(C.total?Math.round(r[1]/C.total*100)+'%':'-')+'</td><td class="muted">'+esc(r[2])+'</td></tr>');
  });
  H.push('<tr><td><b>Total</b></td><td class="num"><b>'+money(C.total)+'</b></td><td class="num">100%</td><td></td></tr>');
  H.push('</table>');
  H.push('<div class="note">Cost per appointment used to divide by Google LSA alone, so it read low. It now uses every marketing dollar. The retainer is effective-dated in api/marketing.js - when the fee changes, add a dated row rather than editing the current one, so closed months keep the cost they actually had.</div>');
  H.push('</section>');

  // BY REP - one column per RESULT REASON, not the CA/Retail rollup.
  // The CA filter in Leap does not pull reliably, so a derived 'signed' figure
  // inherits that error silently and looks authoritative while doing it. Tallying
  // the raw result reasons shows what was actually recorded and lets the reader
  // group it themselves.
  //
  // Columns are built FROM THE DATA and ordered by overall frequency, so a new
  // result reason shows up on its own without anyone editing this file. Zeroes
  // render blank - with a dozen sparse columns a grid of noughts is unreadable.
  var resCols=Object.keys(results).filter(function(k){return k!=='(unresulted)';})
    .sort(function(a,b){return results[b]-results[a];});
  var shortCol=function(x){ return x.length>14 ? x.slice(0,13)+'\u2026' : x; };
  H.push('<section><h2>By rep <span class="muted" style="font-size:12px;font-weight:400">result reasons exactly as recorded in Leap</span></h2>');
  H.push('<div style="overflow-x:auto"><table><tr><th>Rep</th><th class="num">Set</th><th class="num">Ran</th><th class="num">Run %</th>'
    + resCols.map(function(k){return '<th class="num" title="'+esc(k)+'">'+esc(shortCol(k))+'</th>';}).join('')
    + '<th class="num">Unresulted</th></tr>');
  Object.keys(reps).map(function(k){return reps[k];}).sort(function(a,b){return b.set-a.set;}).forEach(function(r){
    H.push('<tr><td>'+esc(r.rep)+'</td><td class="num">'+r.set+'</td><td class="num">'+r.ran+'</td><td class="num">'+pct(r.ran,r.set)+'</td>'
      + resCols.map(function(k){var v=r.byRes[k]||0; return '<td class="num">'+(v||'')+'</td>';}).join('')
      + '<td class="num '+(r.un?'bad':'')+'">'+r.un+' <span class="muted">'+pct(r.un,r.set)+'</span></td></tr>');
  });
  // Column totals, so this table reconciles against the Results section below.
  H.push('<tr style="border-top:2px solid rgba(128,128,128,.45);font-weight:600"><td>All reps</td><td class="num">'+T.set+'</td><td class="num">'+T.ran+'</td><td class="num">'+pct(T.ran,T.set)+'</td>'
    + resCols.map(function(k){return '<td class="num">'+(results[k]||0)+'</td>';}).join('')
    + '<td class="num">'+T.un+'</td></tr>');
  H.push('</table></div></section>');

  H.push('<section><h2>Results</h2><table><tr><th>Result</th><th class="num">Count</th><th class="num">Share</th></tr>');
  Object.keys(results).sort(function(a,b){return results[b]-results[a];}).forEach(function(k){
    H.push('<tr><td class="'+(k==='(unresulted)'?'bad':'')+'">'+esc(k)+'</td><td class="num">'+results[k]+'</td><td class="num">'+pct(results[k],T.set)+'</td></tr>');
  });
  H.push('</table></section>');

  H.push('<section><h2>Referral source</h2><table><tr><th>Source</th><th class="num">Appts</th><th class="num">Share</th></tr>');
  Object.keys(src).sort(function(a,b){return src[b]-src[a];}).forEach(function(k){
    H.push('<tr><td>'+esc(k)+'</td><td class="num">'+src[k]+'</td><td class="num">'+pct(src[k],T.set)+'</td></tr>');
  });
  H.push('</table></section>');

  H.push('<section><h2>Appointments in range</h2><input type="search" id="q" placeholder="Filter by rep, customer, result...">');
  H.push('<table id="tbl"><tr><th>Date</th><th>Rep</th><th>Customer</th><th>Result</th><th>Stage</th><th>Source</th></tr>');
  recs.forEach(function(r){
    H.push('<tr><td>'+esc(r.d)+'</td><td>'+esc(r.rep)+'</td><td>'+esc(r.cust)+'</td>'+
      '<td class="'+(!r.res?'bad':(isCA[r.res]?'ca':(isRT[r.res]?'rt':'')))+'">'+esc(r.res||'UNRESULTED')+'</td>'+
      '<td>'+esc(r.stage)+'</td><td>'+esc(r.src)+'</td></tr>');
  });
  H.push('</table></section>');
  document.getElementById('root').innerHTML=H.join('');
  var q=document.getElementById('q');
  if(q)q.addEventListener('input',function(){
    var v=q.value.toLowerCase(), rows=document.querySelectorAll('#tbl tr');
    for(var i=1;i<rows.length;i++) rows[i].style.display=rows[i].textContent.toLowerCase().indexOf(v)>-1?'':'none';
  });
}
function card(v,l,c,sub){return '<div class="card"><div class="label">'+l+'</div><div class="value '+(c||'')+'">'+v+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>';}

// Month-grid calendar of the appointments already filtered to the selected range.
// Every appointment shows customer, rep and result. Result is carried by a short text
// tag as well as the colour accent, so it still reads without relying on colour.
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
function apClass(r,isCA,isRT,notRan){
  if(!r.res) return ['un','UNRESULTED'];
  if(isCA[r.res]) return ['ca','CA SIGNED'];
  if(isRT[r.res]) return ['rt',r.res.toUpperCase()];
  if(notRan[r.res]) return ['nr',/cancel/i.test(r.res)?'CANCELED':'NO ANSWER'];
  return ['ot',r.res.toUpperCase()];
}
function calSection(recs,f,t,isCA,isRT,notRan){
  var byDay={};
  recs.forEach(function(r){(byDay[r.d]=byDay[r.d]||[]).push(r);});
  Object.keys(byDay).forEach(function(k){byDay[k].sort(function(a,b){return (a.rep||'').localeCompare(b.rep||'')||(a.cust||'').localeCompare(b.cust||'');});});
  var s=new Date(f+'T12:00:00'), e=new Date(t+'T12:00:00');
  var months=[], cur=new Date(s.getFullYear(),s.getMonth(),1), capped=0;
  while(cur<=e){ if(months.length>=14){capped=1;break;} months.push(new Date(cur)); cur.setMonth(cur.getMonth()+1); }
  var H=['<section><h2>Calendar</h2>'];
  H.push('<div class="lg"><span><i class="tg" style="color:var(--good)">CA SIGNED</i></span>'+
         '<span><i class="tg" style="color:var(--blue)">RETAIL / REPAIR</i></span>'+
         '<span><i class="tg" style="color:var(--warn)">CANCELED / NO ANSWER</i></span>'+
         '<span><i class="tg" style="color:var(--bad)">UNRESULTED</i></span>'+
         '<span>'+recs.length+' appointments '+esc(f)+' to '+esc(t)+'</span></div>');
  if(capped) H.push('<div class="muted" style="margin-bottom:8px">Range spans more than 14 months - showing the first 14. Narrow the range to see the rest.</div>');
  H.push('<div class="cal">');
  months.forEach(function(m){
    var y=m.getFullYear(), mo=m.getMonth();
    var first=new Date(y,mo,1), last=new Date(y,mo+1,0);
    var count=0;
    for(var d=1;d<=last.getDate();d++){var k=y+'-'+p2(mo+1)+'-'+p2(d); if(byDay[k]&&k>=f&&k<=t)count+=byDay[k].length;}
    H.push('<div class="mo"><div class="mh">'+MON[mo]+' '+y+'<b>'+count+(count===1?' appt':' appts')+'</b></div>');
    H.push('<div class="dow">'+DOW.map(function(x){return '<div>'+x+'</div>';}).join('')+'</div><div class="grid">');
    for(var i=0;i<first.getDay();i++) H.push('<div class="dy out"></div>');
    for(var day=1;day<=last.getDate();day++){
      var key=y+'-'+p2(mo+1)+'-'+p2(day);
      var inRange=key>=f&&key<=t;
      var list=(inRange&&byDay[key])||[];
      H.push('<div class="dy'+(inRange?'':' out')+(list.length?' has':'')+'"><div class="dn">'+day+'</div>');
      list.forEach(function(r){
        var c=apClass(r,isCA,isRT,notRan);
        H.push('<div class="ap '+c[0]+'" title="'+esc(r.cust+' - '+r.rep+' - '+(r.res||'unresulted')+(r.stage?' - '+r.stage:'')+(r.src?' - source: '+r.src:''))+'">'+
               '<span class="tg">'+esc(c[1])+'</span><b>'+esc(r.cust||'(no customer)')+'</b><em>'+esc(r.rep||'(no rep)')+'</em></div>');
      });
      H.push('</div>');
    }
    var tail=(7-((first.getDay()+last.getDate())%7))%7;
    for(var j=0;j<tail;j++) H.push('<div class="dy out"></div>');
    H.push('</div></div>');
  });
  H.push('</div></section>');
  return H.join('');
}
function p2(n){return (n<10?'0':'')+n;}
</script>

<style id="cal-enhance">
/* --- calendar readability + today --- */
.dy{min-height:104px}
.ap{font-size:11px;padding:3px 6px 4px 8px;margin-top:4px;border-radius:6px;line-height:1.35}
.ap b{font-weight:650}
.ap .tg{font-size:9px}
/* Unresulted is the common case, so calm it down - it was shouting on every card */
.ap.un{opacity:.7}
.dy.today{background:rgba(88,166,255,.12) !important;box-shadow:inset 0 0 0 2px var(--blue)}
.dy.today .dn{color:var(--blue);font-weight:800}
.dy.today .dn::after{content:" · TODAY";font-size:9px;letter-spacing:.06em;font-weight:700}
#upcoming{margin:0 0 22px}
#upcoming .hd{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
#upcoming td.dt{white-space:nowrap;color:var(--dim);font-variant-numeric:tabular-nums}
#upcoming .none{color:var(--dim);font-size:13px}
</style>
<script>
/* Appended enhancement layer. Does not touch draw() - it re-applies after each
   render via MutationObserver, the same pattern ca-bonus.html uses.
   1. highlights today's cell in the calendar
   2. adds an Upcoming panel from records dated after today (api/marketing now
      returns +90 days, so future bookings are in the payload) */
(function () {
  var MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function todayStr() { return (window.D && window.D.today) || new Date().toISOString().slice(0, 10); }
  function pretty(d) {
    var p = String(d).split('-');
    if (p.length !== 3) return d;
    var dt = new Date(+p[0], +p[1] - 1, +p[2]);
    return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function markToday() {
    var t = todayStr();
    var mos = document.querySelectorAll('.cal .mo');
    for (var i = 0; i < mos.length; i++) {
      var h = mos[i].querySelector('.mh');
      if (!h) continue;
      var txt = (h.textContent || '').trim();
      var mi = -1;
      for (var m = 0; m < 12; m++) { if (txt.indexOf(MON[m]) === 0) { mi = m; break; } }
      var ym = txt.match(/(\d{4})/);
      if (mi < 0 || !ym) continue;
      var cells = mos[i].querySelectorAll('.grid .dy');
      for (var c = 0; c < cells.length; c++) {
        var dn = cells[c].querySelector('.dn');
        if (!dn || cells[c].className.indexOf('out') > -1) continue;
        var day = parseInt(dn.textContent, 10);
        if (!day) continue;
        var key = ym[1] + '-' + p2(mi + 1) + '-' + p2(day);
        if (key === t) cells[c].className += ' today';
      }
    }
  }

  function upcoming() {
    var root = document.getElementById('root');
    if (!root || !window.D || !window.D.records) return;
    var t = todayStr();
    var rows = window.D.records.filter(function (r) { return r.d > t; })
      .sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : String(a.time || '').localeCompare(String(b.time || '')); });
    var host = document.getElementById('upcoming');
    if (!host) {
      host = document.createElement('section');
      host.id = 'upcoming';
      root.insertBefore(host, root.firstChild);
    }
    if (!rows.length) {
      host.innerHTML = '<div class="hd"><h2>Upcoming</h2></div><div class="none">Nothing booked after today.</div>';
      return;
    }
    var byDay = {};
    rows.forEach(function (r) { (byDay[r.d] = byDay[r.d] || []).push(r); });
    var days = Object.keys(byDay).sort();
    var h = ['<div class="hd"><h2>Upcoming</h2><span class="muted">' + rows.length + ' booked after today, across ' + days.length + (days.length === 1 ? ' day' : ' days') + '</span></div>'];
    h.push('<table><tr><th>Date</th><th>Time</th><th>Customer</th><th>Rep</th><th>Source</th></tr>');
    rows.slice(0, 60).forEach(function (r) {
      h.push('<tr><td class="dt">' + esc(pretty(r.d)) + '</td><td class="dt">' + esc(r.time || '') + '</td><td>' + esc(r.cust) + '</td><td>' + esc(r.rep) + '</td><td>' + esc(r.src || '') + '</td></tr>');
    });
    h.push('</table>');
    if (rows.length > 60) h.push('<div class="none">Showing the first 60 of ' + rows.length + '.</div>');
    host.innerHTML = h.join('');
  }

  var busy = false;
  function enhance() {
    if (busy) return;
    busy = true;
    try { markToday(); upcoming(); } catch (e) {}
    setTimeout(function () { busy = false; }, 60);
  }
  var root = document.getElementById('root');
  if (root && window.MutationObserver) {
    new MutationObserver(function () { enhance(); }).observe(root, { childList: true });
  }
  setTimeout(enhance, 700);
  setTimeout(enhance, 1800);
  setTimeout(enhance, 3500);
})();
</script>
